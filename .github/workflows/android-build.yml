name: Android Build (yerel EAS)

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "EAS profili"
        required: true
        default: production
        type: choice
        options: [production, preview]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Bagimliliklar
        run: |
          if [ -f pnpm-lock.yaml ]; then npm i -g pnpm && pnpm install --frozen-lockfile
          elif [ -f yarn.lock ]; then yarn install --frozen-lockfile
          else npm ci; fi

      - name: Build
        env:
          EAS_BUILD_NO_EXPO_GO_WARNING: "true"
        run: |
          mkdir -p cikti
          if [ "${{ inputs.profile }}" = "production" ]; then UZANTI=aab; else UZANTI=apk; fi
          eas build --local -p android --profile ${{ inputs.profile }} --non-interactive --output cikti/policeasistan.$UZANTI

      - uses: actions/upload-artifact@v4
        with:
          name: policeasistan-${{ inputs.profile }}
          path: cikti/
          retention-days: 14
